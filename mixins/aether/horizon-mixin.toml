# The Aether, the native half (docs/native-mods.md, "Trait mods").
#
# A trait mod: the launcher builds `api/` into the game and calls `hooks()`, so
# no Horizon source line is patched. Original code, written from public
# behaviour descriptions of the Aether's three bosses; see NOTICE.md.
[mod]
id = "aether"
version = "0.1.0"

# The Horizon revision this bundle was written and checked against.
[compatibility]
horizon_revision = "a85af177a82504f357ff10d5d40d0b7230e2ac32"

[api]
path = "api"
